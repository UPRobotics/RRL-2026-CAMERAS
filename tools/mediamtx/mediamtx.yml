# MediaMTX configuration for debug webcam streaming
rtspAddress: :8554
rtmpAddress: :1935
hlsAddress: :8888
webrtcAddress: :8889

paths:
  webcam:
    runOnReady: >
      C:\Users\Chumbi\AppData\Local\Microsoft\WinGet\Packages\Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe\ffmpeg-8.0.1-full_build\bin\ffmpeg.exe
      -f dshow
      -video_size 1280x720
      -framerate 30
      -i video="HP Wide Vision HD Camera"
      -c:v libx264
      -preset ultrafast
      -tune zerolatency
      -b:v 4M
      -maxrate 4M
      -bufsize 4M
      -g 30
      -bf 0
      -f rtsp
      rtsp://localhost:8554/webcam
    runOnReadyRestart: yes
